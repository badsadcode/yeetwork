name: Test & Export

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Gameplay tests & map validation
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import || true
      - name: Gameplay smoke tests
        run: godot --headless -- --host --map prime --mode ctf --bots 0 --spooky off --test
      - name: Validate maps
        run: |
          for m in prime facing courtyard lagoon highseas moving_day test_chambers warehouse pump_house scrapyard yeetball_stadium res://custom/example_garden/example_garden.tscn; do
            godot --headless -- --map "$m" --validate
          done
      - name: Ship check (High Seas rides the swell, players and cargo stay aboard)
        timeout-minutes: 6
        run: |
          for sea in calm stormy; do
            timeout 120 godot --headless -- --host --map highseas --bots 0 --spooky off --tour x --tour-mode ship --sea "$sea"
          done
      - name: Puzzle check (Moving Day, Test Chambers, the Warehouse, the Pump House and the Scrapyard played through by a script)
        timeout-minutes: 11
        run: |
          for m in moving_day test_chambers warehouse pump_house scrapyard; do
            timeout 180 godot --headless -- --host --map "$m" --mode puzzle --spooky off --tour x --tour-mode puzzle
          done
      - name: Yeetball check (kickoff, goals, hold limit, lost ball, bots playing, the win)
        timeout-minutes: 4
        run: timeout 150 godot --headless -- --host --map yeetball_stadium --mode yeetball --bots 3 --spooky off --tour x --tour-mode yeetball
      - name: YeetHoops check (2s and 3s, dunks, the backboard, bots shooting and scoring, full time)
        timeout-minutes: 5
        run: timeout 220 godot --headless -- --host --map hoops_court --mode hoops --bots 3 --spooky off --tour x --tour-mode hoops
      - name: YeetVolley check (serve, points, out, touches, sides, the net rising, bots rallying, full time)
        timeout-minutes: 5
        run: timeout 220 godot --headless -- --host --map volley_beach --mode volley --bots 3 --spooky off --tour x --tour-mode volley
      - name: Theme check (a map theme on pieces and props, own models first, moving parts)
        timeout-minutes: 3
        run: timeout 120 godot --headless -- --host --map res://custom/example_garden/example_garden.tscn --mode sandbox --bots 0 --spooky off --tour x --tour-mode themes
      - name: Pickups check (first aid, every power-up, the HUD, bots fetching first aid)
        timeout-minutes: 4
        run: timeout 180 godot --headless -- --host --map prime --bots 2 --spooky off --tour x --tour-mode pickups

  export:
    name: Export ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      matrix:
        include:
          - platform: Linux
            path: build/linux/Yeetwork.x86_64
          - platform: Windows
            path: build/windows/Yeetwork.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import project
        run: godot --headless --import || true
      - name: Export
        run: |
          mkdir -v -p "$(dirname '${{ matrix.path }}')"
          godot --headless --export-release "${{ matrix.platform }}" "${{ matrix.path }}"
          ls -la "$(dirname '${{ matrix.path }}')"
      - name: Package
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x build/linux/Yeetwork.x86_64
            # tar keeps the executable bit (artifact zips do not).
            tar -czf dist/Yeetwork-Linux-x86_64.tar.gz -C build/linux .
          else
            cd build/windows && zip -r ../../dist/Yeetwork-Windows-x86_64.zip . && cd ../..
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Yeetwork-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
