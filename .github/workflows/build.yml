name: Test & Export

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.2

jobs:
  test:
    name: Gameplay tests & map validation
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --import || true
      - name: Gameplay smoke tests
        run: godot --headless -- --host --map prime --mode ctf --bots 0 --spooky off --test
      - name: Validate maps
        run: |
          for m in prime facing courtyard lagoon highseas moving_day test_chambers warehouse pump_house scrapyard yeetball_stadium res://maps/fortress.tscn res://maps/foundry.tscn res://custom/example_garden/example_garden.tscn res://custom/make_your_own/workshop.tscn res://custom/make_your_own/boat.tscn res://custom/lighthouse_point/lighthouse_point.tscn; do
            godot --headless -- --map "$m" --validate
          done
      - name: Piece pages up to date (docs/pieces/, every setting described; the walkthroughs' tables match their maps)
        run: godot --headless --script res://tools/make_guide.gd -- --check
      - name: Lighthouse Point check (the new-map walkthrough's map; its ladders, jump pads and door work as the guide says)
        timeout-minutes: 2
        run: timeout 100 godot --headless -- --host --map res://custom/lighthouse_point/lighthouse_point.tscn --mode ctf --bots 0 --spooky off --tour x --tour-mode lighthouse
      - name: Ship check (High Seas rides the swell, players and cargo stay aboard)
        timeout-minutes: 6
        run: |
          for sea in calm stormy; do
            timeout 120 godot --headless -- --host --map highseas --bots 0 --spooky off --tour x --tour-mode ship --sea "$sea"
          done
      - name: Ship routes check (overboard and back up a ladder, a bot too; the bridge, its horn and windows; lashing bridges)
        timeout-minutes: 4
        run: timeout 170 godot --headless -- --host --map highseas --bots 1 --spooky off --tour x --tour-mode shiproutes
      - name: Ship cargo check (lashed containers break loose to blasts and storms, open containers, floating cargo)
        timeout-minutes: 3
        run: timeout 140 godot --headless -- --host --map highseas --bots 0 --spooky off --tour x --tour-mode shipcargo
      - name: Ship weather check (a hurricane's roll and washes; a wash, a rogue wave and a wet deck on a calm sea)
        timeout-minutes: 6
        run: |
          timeout 150 godot --headless -- --host --map highseas_extreme --bots 1 --spooky off --tour x --tour-mode shipweather
          timeout 150 godot --headless -- --host --map highseas_dusk --bots 1 --spooky off --tour x --tour-mode shipweather
      - name: Puzzle check (Moving Day, Test Chambers, the Warehouse, the Pump House and the Scrapyard played through by a script)
        timeout-minutes: 11
        run: |
          for m in moving_day test_chambers warehouse pump_house scrapyard; do
            timeout 180 godot --headless -- --host --map "$m" --mode puzzle --spooky off --tour x --tour-mode puzzle
          done
      - name: Yeetball check (kickoff, goals, hold limit, lost ball, bots playing, the win)
        timeout-minutes: 4
        run: timeout 150 godot --headless -- --host --map yeetball_stadium --mode yeetball --bots 3 --spooky off --tour x --tour-mode yeetball
      - name: YeetHoops check (2s and 3s, dunks, the backboard, bots shooting and scoring, full time)
        timeout-minutes: 5
        run: timeout 300 godot --headless -- --host --map hoops_court --mode hoops --bots 3 --spooky off --tour x --tour-mode hoops
      - name: YeetVolley check (serve, points, out, touches, sides, the net rising, bots rallying, full time)
        timeout-minutes: 5
        run: timeout 220 godot --headless -- --host --map volley_beach --mode volley --bots 3 --spooky off --tour x --tour-mode volley
      - name: Dark map and storm checks (lights, switch, flashlights; lightning)
        timeout-minutes: 4
        run: |
          timeout 100 godot --headless -- --host --map haunted_yard --mode sandbox --bots 2 --spooky off --tour x --tour-mode dark
          timeout 100 godot --headless -- --host --map lagoon --sky storm --mode sandbox --bots 0 --spooky off --tour x --tour-mode dark
      - name: Fixture check (machines humming, spinning, wired, breaking and mending, an electric one)
        timeout-minutes: 3
        run: timeout 100 godot --headless -- --host --map pump_house --mode puzzle --bots 0 --spooky off --tour x --tour-mode fixtures
      - name: MegaYeet check (waves, the ways to the Heart, gates, the meter, kills, kinds, bots finding their way, the shop and personal Y$, traps put down anywhere, the team lift, both bosses, team upgrades, 200 monsters, the fall; a client sees them, puts a trap down and shops)
        timeout-minutes: 12
        run: |
          timeout 450 godot --headless -- --host --map res://maps/fortress.tscn --mode megayeet --bots 3 --spooky off --tour x --tour-mode megayeet
          timeout 120 godot --headless -- --host --map res://maps/fortress.tscn --mode megayeet --bots 11 --spooky off --tour x --tour-mode megayeetbots
          (timeout 70 godot --headless -- --host --map res://maps/fortress.tscn --mode megayeet --bots 2 --port 24781 --spooky off > /dev/null 2>&1 &)
          sleep 5
          timeout 90 godot --headless -- --join 127.0.0.1 --port 24781 --tour x --tour-mode megayeetclient
      - name: Shop window check (every tab of MegaYeet's shop shows its wares)
        timeout-minutes: 2
        run: timeout 70 godot --headless -- --host --map res://maps/fortress.tscn --mode megayeet --bots 0 --spooky off --tour x --tour-mode shop
      - name: Foundry check (from every rift a way to the Heart, the way the map means it; the canal, the bridge, the control room, the Ram down the hall)
        timeout-minutes: 3
        run: timeout 130 godot --headless -- --host --map res://maps/foundry.tscn --mode megayeet --bots 0 --spooky off --tour x --tour-mode foundry
      - name: Make your own check (a pipe's Spout, a drain's Intake, a PropType, a trap of your own in the shop and at work, breakable models and props, models playing their own animations, monsters of your own; a client sees them and a player's own gun)
        timeout-minutes: 4
        run: |
          timeout 100 godot --headless -- --host --map res://custom/make_your_own/workshop.tscn --mode megayeet --bots 0 --spooky off --tour x --tour-mode makeyourown
          (timeout 50 godot --headless -- --host --map res://custom/make_your_own/workshop.tscn --mode megayeet --bots 0 --port 24812 --spooky off --gun scrap_gun > /dev/null 2>&1 &)
          sleep 5
          timeout 70 godot --headless -- --join 127.0.0.1 --port 24812 --tour x --tour-mode makeyourownclient
      - name: Vessel check (a boat of Map Kit pieces rides the swell, Yeets, cargo, ladder, crane and its flag ride along; the island beside it stays put)
        timeout-minutes: 2
        run: timeout 100 godot --headless -- --host --map res://custom/make_your_own/boat.tscn --mode ctf --bots 0 --spooky off --tour x --tour-mode vessel
      - name: High Seas export (its code builder still saves the scene)
        timeout-minutes: 2
        run: |
          cp maps/high_seas.tscn /tmp/high_seas.tscn
          timeout 100 godot --headless -- --host --map highseas --map-source code --bots 0 --spooky off --tour x --tour-mode export_highseas
          cp /tmp/high_seas.tscn maps/high_seas.tscn
      - name: Match setup check (maps that suit each mode, the host's MegaYeet rules, unused pieces left out)
        timeout-minutes: 3
        run: timeout 90 godot --headless -- --host --map res://maps/fortress.tscn --bots 0 --spooky off --tour x --tour-mode setup
      - name: Theme check (a map theme on pieces and props, own models first, moving parts)
        timeout-minutes: 3
        run: timeout 120 godot --headless -- --host --map res://custom/example_garden/example_garden.tscn --mode sandbox --bots 0 --spooky off --tour x --tour-mode themes
      - name: Pickups check (first aid, every power-up, the HUD, bots fetching first aid)
        timeout-minutes: 4
        run: timeout 180 godot --headless -- --host --map prime --bots 2 --spooky off --tour x --tour-mode pickups

  export:
    name: Export ${{ matrix.platform }}
    needs: test
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.7.2
    strategy:
      matrix:
        include:
          - platform: Linux
            path: build/linux/Yeetwork.x86_64
          - platform: Windows
            path: build/windows/Yeetwork.exe
    steps:
      - uses: actions/checkout@v4
      - name: Install export templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          if [ ! -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          fi
      - name: Import project
        run: godot --headless --import || true
      - name: Export
        run: |
          mkdir -v -p "$(dirname '${{ matrix.path }}')"
          godot --headless --export-release "${{ matrix.platform }}" "${{ matrix.path }}"
          ls -la "$(dirname '${{ matrix.path }}')"
      - name: Package
        run: |
          mkdir -p dist
          if [ "${{ matrix.platform }}" = "Linux" ]; then
            chmod +x build/linux/Yeetwork.x86_64
            # tar keeps the executable bit (artifact zips do not).
            tar -czf dist/Yeetwork-Linux-x86_64.tar.gz -C build/linux .
          else
            cd build/windows && zip -r ../../dist/Yeetwork-Windows-x86_64.zip . && cd ../..
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Yeetwork-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
